<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Chat Overlay</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 16px;
            overflow: hidden;
            color: #ffffff;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-width: 480px;
            width: 100%;
        }

        .chat-box {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 3px 2px;
            border-radius: 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            animation: slideIn 0.25s ease-out;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            display: block;
        }

        .chat-content {
            flex-grow: 1;
            font-size: 14px;
            line-height: 1.25;
            word-break: break-word;
            display: inline-block;
        }

        .user-wrapper {
            display: inline;
            font-weight: 700;
            margin-right: 6px;
        }

        /* Warna Sesuai Role */
        .user-default {
            color: #ffffff !important;
        }

        .user-sponsor {
            color: #2ba640 !important;
        }

        .user-moderator {
            color: #5e84f1 !important;
        }

        .user-owner {
            color: #ffd700 !important;
        }

        /* Badge & Emote sejajar rapi dengan baseline teks */
        .chat-badge {
            width: 15px;
            height: 15px;
            object-fit: contain;
            vertical-align: -2px;
            margin: 0 2px;
            display: inline-block;
        }

        .mod-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
            vertical-align: -2px;
            margin: 0 2px;
            display: inline-block;
        }

        .chat-emote {
            width: 22px;
            height: 22px;
            object-fit: contain;
            vertical-align: -4px;
            display: inline-block;
            margin: 0 2px;
        }

        .msg {
            color: #efefef;
            vertical-align: middle;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="chat-container"></div>

    <script>
        const socket = io();
        const container = document.getElementById('chat-container');
        const MAX_MESSAGES = 10;

        const MOD_SVG = `
            <svg class="mod-icon" viewBox="0 0 24 24">
                <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
            </svg>`;

        socket.on('new_chat', function (data) {
            const item = document.createElement('div');
            item.className = 'chat-box';

            const userClass = `user-${data.role_color}`;

            let badges = '';
            if (data.is_mod) badges += MOD_SVG;
            if (data.badge_url) badges += `<img class="chat-badge" src="${data.badge_url}" alt="badge" />`;

            item.innerHTML = `
                <img class="avatar" src="${data.avatar}" alt="Avatar">
                <div class="chat-content">
                    <span class="user-wrapper ${userClass}">${data.author}${badges}:</span>
                    <span class="msg">${data.message}</span>
                </div>
            `;

            container.appendChild(item);

            if (container.children.length > MAX_MESSAGES) {
                container.removeChild(container.firstChild);
            }
        });
    </script>
</body>

</html>
